<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pipelin favicon — neon-lime tile carrying the ink "tracking ring + breakout arrow" glyph.
       Mirrors .oo-logo-tile (135deg lime gradient) and the Logo mark in src/components/ui/Logo.tsx. -->
  <defs>
    <linearGradient id="oo-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4ff66" />
      <stop offset="55%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#b8e600" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#oo-tile)" />
  <g transform="translate(4 4)"
     fill="none" stroke="#0a0b10" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- tracking ring — open across the NE quadrant -->
    <path d="M19.5 11.7A7.5 7.5 0 1 1 12.3 4.5" />
    <!-- arrow breaking out to the north-east -->
    <path d="M10 14 16 8" />
    <path d="M13 8H16V11" />
  </g>
</svg>
